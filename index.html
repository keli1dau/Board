<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>看板</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--card:#fff;--fg:#1d1f23;--mut:#6b7280;--line:#d5d8de;--bad:#c62828;--btn:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--fg:#e6e7ea;--mut:#9aa0a8;--line:#3a3f48;--bad:#ef6b6b;--btn:#3d7bf0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;box-sizing:border-box}
h1{font-size:18px;margin:0 0 16px}
input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
label{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px}
button{width:100%;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--btn);color:#fff}
button:disabled{opacity:.6}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--mut)}
#msg.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap"><form id="f" autocomplete="on">
<h1>请输入密码</h1>
<input type="text" name="username" value="board" autocomplete="username" hidden>
<input type="password" id="pw" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="rm"> 记住这台设备</label>
<button id="go" type="submit">打开</button>
<div id="msg"></div>
</form></div>

  var STORE = "board_key_" + P.salt;
  var f = document.getElementById("f"), pw = document.getElementById("pw"), rm = document.getElementById("rm"),
      go = document.getElementById("go"), msg = document.getElementById("msg");
  var S = window.crypto && window.crypto.subtle;
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function say(t, bad) { msg.textContent = t; msg.className = bad ? "bad" : ""; }
  function load() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function drop() { try { localStorage.removeItem(STORE); } catch (e) {} }
  function derive(p) {
    return S.importKey("raw", new TextEncoder().encode(p.normalize("NFC")), "PBKDF2", false, ["deriveBits"])
